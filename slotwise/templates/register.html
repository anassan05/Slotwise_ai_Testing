<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | SlotWise</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual"><a class="auth-brand" href="/">S <span>SlotWise</span></a><div class="visual-copy"><p>OPERATIONS CONSOLE</p><h1>A sharper way to run your schedule.</h1><span>Start with a secure workspace for appointments, persistence, and quality testing.</span></div><div class="visual-footer"><span class="status-dot"></span> Built on Flask + SQLite</div></section>
    <section class="auth-panel"><div class="auth-card"><div class="auth-heading"><p class="eyebrow">Get started</p><h2>Create your account</h2><p>Set up your workspace access in less than a minute.</p></div><form id="register-form"><label>Full name<input name="full_name" autocomplete="name" required placeholder="Avery Morgan"></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@company.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="auth-button" type="submit">Create account</button><p id="auth-message" class="auth-message" role="alert"></p></form><p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p></div></section>
  </main>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
